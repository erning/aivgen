[project]
name = "aivgen"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Zhang Erning", email = "zhang@erning.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "rich>=14.3.1",
    "typer>=0.21.1",
    "pyyaml>=6.0.3",
    "openai>=1.68.0",
    "google-genai>=1.0.0",
    "anthropic>=0.45.0",
    "ollama>=0.4.0",
]

[project.scripts]
aiv = "aivgen.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.37.2",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "B017", # assertRaises(Exception) style
]
"src/aivgen/cli.py" = [
    "B008", # Typer Option/Argument in defaults is standard pattern
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

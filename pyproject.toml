[project]
name = "aivgen"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Zhang Erning", email = "zhang@erning.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "rich>=14.3.1",
    "typer>=0.21.1",
    "pyyaml>=6.0.3",
    "openai>=1.68.0",
]

[project.scripts]
aiv = "aivgen.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.37.2",
    "pytest>=8.0.0",
]
